<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="мероприятия, афиша, бронирование, события">
    <meta name="description" content="Система управления событиями: афиша, бронирование и организация мероприятий">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub — афиша мероприятий</title>
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/login.css">
    <script type="module" src="./scripts/api.js"></script>
</head>
<body>
    <header>
        <nav class="wrapper">
            <a class="h6 logo" href="./index.html">
                Together
            </a>
            <div class="header__nav-list">
                <a href="./index.html">Главная</a>
                <a href="./main.html">Создать событие</a>
                <a href="./about.html">О нас</a>
                <a href="./login.html" class="header__button-enter">
                    <button class="primary">
                        Войти
                    </button>
                </a>
                <button class="logout error" >
                    Выйти
                </button>
            </div>
            <div class="header__menu">
                <button id="menu-bar">
                    <img src="./public/menu.svg">
                </button>
                <div id="header__menu__list" class="disable">
                    <a href="./index.html">Главная</a>
                    <a href="./main.html">Создать событие</a>
                    <a href="./about.html">О нас</a>
                    <a href="./login.html" class="header__button-enter">
                        <button class="primary">
                            Войти
                        </button>
                    </a>
                    <button class="logout error" >
                        Выйти
                    </button>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <form id="login">
          <label for="email" class="body1">Введите почту</label>
          <input id="email" autocomplete="off" name="email" placeholder="Email" type="email" >
          <span class="body1" id="email-error">Почта введена некорректно</span>
          <label for="password" class="body1">Введите пароль</label>
          <input id="password" name="password" placeholder="Password" type="password" >
          <span class="body1" id="password-error">Неверный пароль</span>
          <button class="primary" type="submit">
            Войти
          </button>
          <p class="body1">Еще не зарегистрированы? <a href="./register.html">Зарегистрироваться</a></p>
        </form>
    </main>
    <footer>
        <div class="wrapper">
            <span class="h6 logo">Together</span>
            <p>© 2025 EventHub. Все права защищены.</p>
            <p id="load-time">Адрес: г. Москва, ул. Примерная, 1</p>
        </div>
    </footer>
    <script>
      (function() {
        window.addEventListener('load', function() {
          const loadTime = performance.now();

          const footer = document.getElementById('load-time');

          footer.textContent = `⏱ Время загрузки страницы: ${loadTime.toFixed(2)} мс`;
        });
      })();
    </script>
    <script type="module" src="./scripts/header.js"></script>
    <script type="module" src="./scripts/login.js"></script>
</body>
</html>
