<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="мероприятия, афиша, бронирование, события">
    <meta name="description" content="Система управления событиями: афиша, бронирование и организация мероприятий">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub — афиша мероприятий</title>
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/login.css">
</head>
<body>
    <header>
        <nav class="wrapper">
            <a class="h6 logo" href="./index.html">
                Together
            </a>
            <div class="header__nav-list">
                <a href="./index.html">Главная</a>
                <a href="./create-event.html">Создать событие</a>
                <a href="./about.html">О нас</a>
                <a href="./login.html">
                    <button class="primary header__button-enter">
                        Войти
                    </button>
                </a>
            </div>
            <div class="header__menu">
                <button id="menu-bar">
                    <img src="./public/menu.svg">
                </button>
                <div id="header__menu__list" class="disable">
                    <a href="./index.html">Главная</a>
                    <a href="./create-event.html">Создать событие</a>
                    <a href="./about.html">О нас</a>
                    <a href="./login.html">
                        <button class="primary">
                            Войти
                        </button>
                    </a>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <form id="register">
          <label for="name" class="body1">Введите почту</label>
          <input id="name" autocomplete="off" name="name" placeholder="Name" type="name" >
          <label for="email" class="body1">Введите почту</label>
          <input id="email" autocomplete="off" name="email" placeholder="Email" type="email" >
          <span class="body1" id="email-error">Почта введена некорректно</span>
          <label for="password" class="body1">Введите пароль</label>
          <input id="password" name="password" placeholder="Password" type="password" >
          <span class="body1" id="password-error">Длина пароля не менее 8 символов</span>
          <label for="repassword" class="body1">Повторите пароль</label>
          <input id="repassword" name="repassword" placeholder="Return Password" type="password" >
          <span class="body1" id="repassword-error">Пароли должны совпадать</span>
          <button class="primary" type="submit">
            Зарегистрироваться
          </button>
        </form>
    </main>
    <footer>
        <div class="wrapper">
            <span class="h6 logo">Together</span>
            <p>© 2025 EventHub. Все права защищены.</p>
            <p>Адрес: г. Москва, ул. Примерная, 1</p>
        </div>
    </footer>
    <script src="./scripts/header.js"></script>
    <script src="./scripts/register.cjs"></script>
</body>
</html>
